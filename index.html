<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>현장 사진 증거표시</title>

<style>
body{margin:0;font-family:system-ui;background:#f2f2f2}
header{
  background:#111;color:#fff;padding:8px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap
}
#container{position:relative;width:100%}
#photo{width:100%;display:block}
canvas{position:absolute;left:0;top:0}
.mark{
  position:absolute;background:#fff;border:1px solid #aaa;
  border-radius:6px;padding:4px;font-size:13px;width:160px
}
.mark b{display:block;margin-bottom:2px}
.mark input{width:100%;border:none;outline:none}
button{padding:4px 8px;font-size:13px}
</style>
</head>

<body>

<header>
  <input type="file" id="file" accept="image/*">
  <select id="color">
    <option value="red">🔴 Red</option>
    <option value="blue">🔵 Blue</option>
    <option value="green">🟢 Green</option>
  </select>

  원크기
  <input type="range" id="radius" min="15" max="120" value="40">

  선굵기
  <input type="range" id="line" min="2" max="12" value="4">

  <button onclick="saveImage()">증거사진 저장</button>
  <button onclick="deleteSelected()">선택 원 삭제</button>
</header>

<div id="container">
  <img id="photo">
  <canvas id="overlay"></canvas>
</div>

<script>
const img = document.getElementById("photo");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");

const container = document.getElementById("container");
const colorSel = document.getElementById("color");
const radiusInput = document.getElementById("radius");
const lineInput = document.getElementById("line");

/* 상태 변수 */
const marks = [];
let selectedIndex = null;
let evidenceNo = 1;

let startX = 0, startY = 0;
let drawing = false;

let dragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

/* 좌표 계산 */
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

/* 원 히트 테스트 */
function hitTest(x, y, m){
  const dx = x - m.x;
  const dy = y - m.y;
  return Math.sqrt(dx*dx + dy*dy) <= m.r;
}

/* ===== START (선택 or 새 원 준비) ===== */
canvas.addEventListener("mousedown", startAction);
canvas.addEventListener("touchstart", startAction);

function startAction(e){
  e.preventDefault();

  const {x, y} = getPos(e);
  selectedIndex = null;
  dragging = false;
  drawing = false;

  // 기존 원 선택 (위에 있는 것 우선)
  for(let i = marks.length - 1; i >= 0; i--){
    if(hitTest(x, y, marks[i])){
      selectedIndex = i;
      dragging = true;

      dragOffsetX = x - marks[i].x;
      dragOffsetY = y - marks[i].y;

      radiusInput.value = marks[i].r;
      lineInput.value   = marks[i].line;

      redraw();
      return;
    }
  }

  // 새 원 생성 준비
  startX = x;
  startY = y;
  drawing = true;
}

/* ===== MOVE (드래그 이동) ===== */
canvas.addEventListener("mousemove", moveAction);
canvas.addEventListener("touchmove", moveAction);

function moveAction(e){
  if(!dragging || selectedIndex === null) return;
  e.preventDefault();

  const {x, y} = getPos(e);
  const m = marks[selectedIndex];

  m.x = x - dragOffsetX;
  m.y = y - dragOffsetY;

  const box = document.querySelectorAll(".mark")[selectedIndex];
  if(box){
    box.style.left = (m.x - 80) + "px";
    box.style.top  = (m.y + m.r + 6) + "px";
  }

  redraw();
}

/* ===== END (드래그 종료 + 새 원 생성) ===== */
canvas.addEventListener("mouseup", endAction);
canvas.addEventListener("touchend", endAction);

function endAction(){
  if(dragging){
    dragging = false;
    return;
  }

  if(!drawing) return;
  drawing = false;

  const r  = parseInt(radiusInput.value);
  const lw = parseInt(lineInput.value);

  marks.push({
    x: startX,
    y: startY,
    r,
    line: lw,
    color: colorSel.value,
    no: evidenceNo
  });

  selectedIndex = marks.length - 1;

  const box = document.createElement("div");
  box.className = "mark";
  box.style.left = (startX - 80) + "px";
  box.style.top  = (startY + r + 6) + "px";
  box.innerHTML = `<input placeholder="내용 입력">`;
  container.appendChild(box);

  evidenceNo++;
  redraw();
}

/* 이미지 로드 */
document.getElementById("file").addEventListener("change", e=>{
  const f = e.target.files[0];
  if(!f) return;
  img.src = URL.createObjectURL(f);
});

img.onload = ()=>{
  canvas.width = img.clientWidth;
  canvas.height = img.clientHeight;
};

/* 삭제 */
function deleteSelected(){
  if(selectedIndex === null){
    alert("삭제할 증거를 먼저 선택하세요.");
    return;
  }

  document.querySelectorAll(".mark")[selectedIndex]?.remove();
  marks.splice(selectedIndex, 1);

  marks.forEach((m,i)=>m.no=i+1);
  evidenceNo = marks.length + 1;

  document.querySelectorAll(".mark b").forEach((b,i)=>{
    b.textContent = `증거 ${i+1}`;
  });

  selectedIndex = null;
  redraw();
}

/* 다시 그리기 */
function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  marks.forEach((m,i)=>{
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
    ctx.strokeStyle = m.color;
    ctx.lineWidth = m.line;

    if(i === selectedIndex){
      ctx.setLineDash([6,4]);
    }else{
      ctx.setLineDash([]);
    }

    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = m.color;
    ctx.font = "bold 16px sans-serif";
    ctx.fillText(m.no, m.x - 6, m.y + 6);
  });
}

/* 슬라이더 */
radiusInput.addEventListener("input", ()=>{
  if(selectedIndex === null) return;
  marks[selectedIndex].r = parseInt(radiusInput.value);
  redraw();
});

lineInput.addEventListener("input", ()=>{
  if(selectedIndex === null) return;
  marks[selectedIndex].line = parseInt(lineInput.value);
  redraw();
});

/* 저장 */
function saveImage(){
  const out = document.createElement("canvas");
  out.width = img.naturalWidth;
  out.height = img.naturalHeight;
  const octx = out.getContext("2d");

  octx.drawImage(img, 0, 0, out.width, out.height);

  const sx = out.width / canvas.width;
  const sy = out.height / canvas.height;

  marks.forEach(m=>{
    octx.beginPath();
    octx.arc(m.x*sx, m.y*sy, m.r*sx, 0, Math.PI*2);
    octx.strokeStyle = m.color;
    octx.lineWidth = m.line * sx;
    octx.stroke();

    octx.fillStyle = m.color;
    octx.font = "bold 32px sans-serif";
    octx.fillText(m.no, m.x*sx - 10, m.y*sy + 10);
  });

  marks.forEach((m,i)=>{
    const box = document.querySelectorAll(".mark")[i];
    if(!box) return;

    const input = box.querySelector("input").value;
    if(!input) return;

    // === 박스 위치 (화면 → 원본 비율 변환) ===
    const boxX = (m.x - 80) * sx;
    const boxY = (m.y + m.r + 6) * sy;
    const boxW = 160 * sx;
    const boxH = 44 * sy;

    // ① 박스 배경
    octx.fillStyle = "#ffffff";
    octx.strokeStyle = "#aaaaaa";
    octx.lineWidth = 2 * sx;
    octx.fillRect(boxX, boxY, boxW, boxH);
    octx.strokeRect(boxX, boxY, boxW, boxH);

    // 공통 정렬 설정
    octx.textAlign = "center";
    octx.textBaseline = "middle";

    // 내용만 중앙에
    octx.fillStyle = "#000";
    octx.font = `${13*sy}px sans-serif`;
    octx.fillText(
      input,
      boxX + boxW / 2,
      boxY + boxH / 2
    );

    // 정렬 초기화 (다른 그림 영향 방지)
    octx.textAlign = "left";
    octx.textBaseline = "alphabetic";

    });



  const a=document.createElement("a");
  a.href = out.toDataURL("image/jpeg",0.95);
  a.download = "증거사진.jpg";
  a.click();
}
</script>

</body>
</html>
