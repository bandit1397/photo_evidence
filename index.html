<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>현장 사진 증거표시</title>

<style>
body{margin:0;font-family:system-ui;background:#f2f2f2}
header{
  background:#111;color:#fff;padding:8px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap
}
#container{position:relative;width:100%}
#photo{width:100%;display:block}
canvas{position:absolute;left:0;top:0}
.mark{
  position:absolute;background:#fff;border:1px solid #aaa;
  border-radius:6px;padding:4px;font-size:13px;width:160px
}
.mark b{display:block;margin-bottom:2px}
.mark input{width:100%;border:none;outline:none}
button{padding:4px 8px;font-size:13px}
</style>
</head>

<body>

<header>
  <input type="file" id="file" accept="image/*">
  <select id="color">
    <option value="red">🔴 Red</option>
    <option value="blue">🔵 Blue</option>
    <option value="green">🟢 Green</option>
  </select>
  원크기
  <input type="range" id="radius" min="15" max="120" value="40">

  선굵기
  <input type="range" id="line" min="2" max="12" value="4">
  
  <button onclick="saveImage()">증거사진 저장</button>
  <button onclick="deleteSelected()">선택 원 삭제</button>
</header>

<div id="container">
  <img id="photo">
  <canvas id="overlay"></canvas>
</div>

<script>
const img=document.getElementById("photo");
const canvas=document.getElementById("overlay");
const ctx=canvas.getContext("2d");
const container=document.getElementById("container");
const colorSel=document.getElementById("color");
const radiusInput = document.getElementById("radius");
const lineInput   = document.getElementById("line");

let startX,startY,drawing=false;
let evidenceNo=1;
const marks=[];
let selectedIndex = null;

document.getElementById("file").addEventListener("change",e=>{
  const f=e.target.files[0];
  if(!f) return;
  img.src=URL.createObjectURL(f);
});

img.onload=()=>{
  canvas.width=img.clientWidth;
  canvas.height=img.clientHeight;
};

canvas.addEventListener("touchstart", e=>{
  e.preventDefault();

  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = t.clientX - rect.left;
  const y = t.clientY - rect.top;

  selectedIndex = null;

  // ① 기존 원 선택 여부 확인 (뒤에 그린 원 우선)
  for(let i = marks.length - 1; i >= 0; i--){
    const m = marks[i];
    const dx = x - m.x;
    const dy = y - m.y;

    if(Math.sqrt(dx*dx + dy*dy) <= m.r){
      selectedIndex = i;

      // 슬라이더를 선택된 원 값으로 동기화
      radiusInput.value = m.r;
      lineInput.value   = m.line;

      drawing = false;   // ⚠ 새 원 생성 방지
      return;            // ⚠ 여기서 종료
    }
  }

  // ② 기존 원이 아니면 → 새 원 생성 준비
  startX = x;
  startY = y;
  drawing = true;
 });


canvas.addEventListener("touchend", e=>{
  if(!drawing) return;   // 🔴 선택만 했을 경우 방지

  drawing = false;

  const r  = parseInt(radiusInput.value);
  const lw = parseInt(lineInput.value);

  marks.push({
    x: startX,
    y: startY,
    r: r,
    line: lw,
    color: colorSel.value,
    no: evidenceNo
  });

  selectedIndex = marks.length - 1;

  const box=document.createElement("div");
  box.className="mark";
  box.style.left=(startX-80)+"px";
  box.style.top=(startY+r+6)+"px";
  box.innerHTML=`<b>증거 ${evidenceNo}</b><input placeholder="내용 입력">`;
  container.appendChild(box);

  evidenceNo++;
  redraw();
});

// 🔴 바로 여기 ⭐⭐⭐
function deleteSelected(){
  if(selectedIndex === null){
    alert("삭제할 증거를 먼저 선택하세요.");
    return;
  }

  // 설명 박스 제거
  const boxes = document.querySelectorAll(".mark");
  if(boxes[selectedIndex]){
    boxes[selectedIndex].remove();
  }

  // 데이터 제거
  marks.splice(selectedIndex, 1);

  // 🔧 번호 재정렬 (핵심)
  marks.forEach((m, i) => {
    m.no = i + 1;
  });
  evidenceNo = marks.length + 1;

  document.querySelectorAll(".mark b").forEach((b,i)=>{
    b.textContent = `증거 ${i+1}`;
  });

  selectedIndex = null;
  redraw();
}


function redraw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  marks.forEach((m,i)=>{
    ctx.beginPath();
    ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
    ctx.strokeStyle=m.color;
    ctx.lineWidth=m.line;

    if(i === selectedIndex){
      ctx.setLineDash([6,4]);
    }else{
      ctx.setLineDash([]);
    }

    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle=m.color;
    ctx.font="bold 16px sans-serif";
    ctx.fillText(m.no,m.x-6,m.y+6);
  });
}


// ④ 캔버스 클릭/드래그 등 기존 이벤트들
//canvas.addEventListener("mousedown", ...);
//canvas.addEventListener("mousemove", ...);
//canvas.addEventListener("mouseup", ...);

// ✅ ⑤ 여기 ←↓↓↓↓ 추가
radiusInput.addEventListener("input", ()=>{
  if(selectedIndex === null) return;
  marks[selectedIndex].r = parseInt(radiusInput.value);
  redraw();
});

lineInput.addEventListener("input", ()=>{
  if(selectedIndex === null) return;
  marks[selectedIndex].line = parseInt(lineInput.value);
  redraw();
});

/* 🔐 증거사진 저장 핵심 */
function saveImage(){
  const out=document.createElement("canvas");
  out.width=img.naturalWidth;
  out.height=img.naturalHeight;
  const octx=out.getContext("2d");

  // 원본 사진
  octx.drawImage(img,0,0,out.width,out.height);

  const sx=out.width/canvas.width;
  const sy=out.height/canvas.height;

  // 원 + 번호
  marks.forEach((m,i)=>{
    octx.beginPath();
    octx.arc(m.x*sx,m.y*sy,m.r*sx,0,Math.PI*2);
    octx.strokeStyle=m.color;
    octx.lineWidth = m.line * sx;
    octx.stroke();

    octx.fillStyle=m.color;
    octx.font="bold 32px sans-serif";
    octx.fillText(m.no,m.x*sx-10,m.y*sy+10);
  });

  // 설명 텍스트
  document.querySelectorAll(".mark").forEach((box,i)=>{
    const input=box.querySelector("input").value;
    if(!input) return;
    const x=parseInt(box.style.left)*sx;
    const y=parseInt(box.style.top)*sy;
    octx.fillStyle="#000";
    octx.font="24px sans-serif";
    octx.fillText(`증거 ${i+1}: ${input}`,x,y+24);
  });

  const link=document.createElement("a");
  link.href=out.toDataURL("image/jpeg",0.95);
  link.download="증거사진.jpg";
  link.click();
}
</script>

</body>
</html>
